kind: Deployment
apiVersion: apps/v1

metadata:
  name: server-deployment
  namespace: devnetwork-ns
  labels:
    app: server

spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-pod
  template:
    metadata:
      labels:
        app: server-pod
    spec:
      containers:
        - name: server-container
          image: ankushpainuly1729/devnetwork-server
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: server-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
